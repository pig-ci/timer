<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f00ff"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="14.5" fill="url(#g)"/>

  <!-- 時針：指向 10 點 -->
