<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>計時器</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    color: #2d3748;
  }

  /* ---------- 版面：整個視窗 ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- 頂部工具列 ---------- */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: rgba(255, 255, 255, .12);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, .18);
  }

  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #fff;
  }

  .topbar-spacer { flex: 1 1 auto; }

  .topbar button {
    font-family: inherit;
    font-size: 14px;
    padding: 9px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, transform .05s ease;
  }
  .topbar button:active { transform: scale(.97); }

  .btn-primary {
    background: #fff;
    color: #5a67d8;
    font-weight: 600;
  }
  .btn-primary:hover { background: #edf2f7; }

  .btn-ghost {
    background: rgba(255, 255, 255, .18);
    color: #fff;
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, .32); }

  /* ---------- 計時器網格 ----------
     電腦版每行三個，從左到右鋪滿整個畫面寬度。 */
  .grid {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    align-content: start;
  }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 720px) {
    .grid {
      grid-template-columns: 1fr;
      padding: 12px;
      gap: 12px;
    }
    h1 { font-size: 16px; letter-spacing: 2px; }
  }

  /* ---------- 單一計時器卡片 ---------- */
  .timer-card {
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 18px 16px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .timer-name {
    flex: 1 1 auto;
    min-width: 0;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #718096;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    transition: border-color .15s ease, background .15s ease;
  }
  .timer-name:hover { border-color: #e2e8f0; }
  .timer-name:focus {
    outline: none;
    border-color: #667eea;
    background: #f7fafc;
    color: #2d3748;
  }

  .icon-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    font-size: 14px;
    line-height: 1;
    color: #a0aec0;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: #fed7d7; color: #e53e3e; }

  .time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(26px, 13cqw, 96px);
    line-height: 1.1;
    letter-spacing: 1px;
    text-align: center;
    color: #2d3748;
    user-select: none;
    transition: color .15s ease;
  }

  .time.finished {
    color: #e53e3e;
    animation: pulse .9s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { opacity: .35; }
  }

  .btns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .btns button {
    padding: 11px 0;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    background: #667eea;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, transform .05s ease;
  }
  .btns button:not(:disabled):hover { background: #5a6fd6; }
  .btns button:not(:disabled):active { transform: scale(.97); }

  .btns button.secondary {
    background: #edf2f7;
    color: #4a5568;
  }
  .btns button.secondary:not(:disabled):hover { background: #e2e8f0; }

  .btns button:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
  }

  /* ---------- 模式列 ---------- */
  .mode-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .mode-select {
    flex: 0 0 auto;
    padding: 8px 30px 8px 12px;
    font-family: inherit;
    font-size: 14px;
    color: #4a5568;
    background-color: #edf2f7;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%23718096' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 11px center;
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    transition: background-color .15s ease;
  }
  .mode-select:hover:not(:disabled) { background-color: #e2e8f0; }
  .mode-select:focus {
    outline: none;
    border-color: #667eea;
    background-color: #f7fafc;
  }
  .mode-select:disabled { opacity: .5; cursor: not-allowed; }

  /* 倒計時時長：時 / 分 / 秒 */
  .duration-inputs {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    color: #718096;
  }
  .duration-inputs.hidden { display: none; }

  .duration-inputs input {
    width: 44px;
    padding: 7px 4px;
    font-family: inherit;
    font-size: 14px;
    text-align: center;
    color: #2d3748;
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .duration-inputs input::-webkit-outer-spin-button,
  .duration-inputs input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .duration-inputs input:focus {
    outline: none;
    border-color: #667eea;
    background: #fff;
  }
  .duration-inputs input:disabled { opacity: .5; cursor: not-allowed; }

  .duration-inputs span {
    margin-right: 3px;
  }

  /* ---------- 計次列表 ---------- */
  .laps {
    display: none;
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 150px;
    overflow-y: auto;
    text-align: left;
  }
  .laps.visible { display: block; }

  .laps li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 4px;
    font-size: 14px;
    color: #4a5568;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid #edf2f7;
  }
  .laps li:last-child { border-bottom: none; }
</style>
</head>
<body>

  <div class="app">
    <header class="topbar">
      <h1>計時器</h1>
      <span class="topbar-spacer"></span>
      <button id="addBtn" class="btn-primary" type="button">＋ 新增計時器</button>
      <button id="fsBtn" class="btn-ghost" type="button">全螢幕</button>
    </header>

    <main id="grid" class="grid"></main>
  </div>

<script>
(function () {
  'use strict';

  var grid   = document.getElementById('grid');
  var addBtn = document.getElementById('addBtn');
  var fsBtn  = document.getElementById('fsBtn');

  var timers = new Map();   // id -> timer 物件
  var seq    = 0;
  var rafId  = null;

  /* ---------------- 時間工具 ---------------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // 00:00:00.00（時:分:秒.百分秒）
  function format(ms) {
    if (ms < 0) ms = 0;
    ms = Math.floor(ms);
    var cs = Math.floor(ms / 10) % 100;
    var s  = Math.floor(ms / 1000) % 60;
    var m  = Math.floor(ms / 60000) % 60;
    var h  = Math.floor(ms / 3600000);
    return pad(h) + ':' + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  // 已流逝毫秒數
  function elapsedMs(t) {
    return t.accumulated + (t.running ? performance.now() - t.startStamp : 0);
  }

  // 要顯示的毫秒數：正計時 = 已流逝；倒計時 = 剩餘
  function displayMs(t) {
    var e = elapsedMs(t);
    if (t.mode === 'down') return Math.max(0, t.duration - e);
    return e;
  }

  function updateTime(t) {
    t.timeEl.textContent = format(displayMs(t));
    t.timeEl.classList.toggle('finished', t.mode === 'down' && t.finished);
  }

  function setInputsEnabled(t, enabled) {
    t.modeSelect.disabled = !enabled;
    t.durHr.disabled  = !enabled;
    t.durMin.disabled = !enabled;
    t.durSec.disabled = !enabled;
  }

  /* ---------------- 單一 rAF 迴圈，服務所有計時器 ---------------- */

  function ensureLoop() {
    if (rafId === null) rafId = requestAnimationFrame(loop);
  }

  function loop() {
    rafId = null;
    var anyRunning = false;

    timers.forEach(function (t) {
      if (!t.running) return;

      // 倒計時歸零 → 停在 00:00:00.00
      if (t.mode === 'down' && elapsedMs(t) >= t.duration) {
        t.accumulated = t.duration;
        t.running = false;
        t.finished = true;
        t.startBtn.textContent = '開始';
        t.lapBtn.disabled = true;
        setInputsEnabled(t, true);
        updateTime(t);
        return;
      }

      updateTime(t);
      anyRunning = true;
    });

    if (anyRunning) rafId = requestAnimationFrame(loop);
  }

  /* ---------------- 計時器行為 ---------------- */

  function startTimer(t) {
    if (t.running) return;

    if (t.mode === 'down') {
      if (t.duration <= 0) return;               // 時長為 0 不啟動
      if (t.finished || t.accumulated >= t.duration) {
        // 已完成 → 從頭再跑一輪
        t.accumulated = 0;
        t.finished = false;
        t.lapCount = 0;
        t.lapsEl.innerHTML = '';
        t.lapsEl.classList.remove('visible');
        updateTime(t);
      }
    }

    t.running = true;
    t.startStamp = performance.now();
    t.startBtn.textContent = '暫停';
    t.lapBtn.disabled = false;
    setInputsEnabled(t, false);
    updateTime(t);
    ensureLoop();
  }

  function pauseTimer(t) {
    if (!t.running) return;
    t.accumulated += performance.now() - t.startStamp;
    t.running = false;
    t.startBtn.textContent = '開始';
    setInputsEnabled(t, true);
    updateTime(t);
  }

  function toggleTimer(t) {
    t.running ? pauseTimer(t) : startTimer(t);
  }

  function resetTimer(t) {
    t.running = false;
    t.accumulated = 0;
    t.startStamp = 0;
    t.lapCount = 0;
    t.finished = false;

    t.startBtn.textContent = '開始';
    t.lapBtn.disabled = true;
    t.lapsEl.innerHTML = '';
    t.lapsEl.classList.remove('visible');
    setInputsEnabled(t, true);
    updateTime(t);
  }

  function addLap(t) {
    if (!t.running && t.accumulated === 0) return;

    t.lapCount++;

    var li   = document.createElement('li');
    var name = document.createElement('span');
    var time = document.createElement('span');

    name.textContent = '第 ' + t.lapCount + ' 次';
    time.textContent = format(displayMs(t));

    li.appendChild(name);
    li.appendChild(time);
    t.lapsEl.insertBefore(li, t.lapsEl.firstChild);  // 最新在上
    t.lapsEl.classList.add('visible');
  }

  /* ---------------- 模式 / 時長 ---------------- */

  function onModeChange(t) {
    t.mode = t.modeSelect.value;
    t.durWrap.classList.toggle('hidden', t.mode !== 'down');
    resetTimer(t);
  }

  function applyDuration(t) {
    var h = parseInt(t.durHr.value, 10);
    var m = parseInt(t.durMin.value, 10);
    var s = parseInt(t.durSec.value, 10);

    if (isNaN(h) || h < 0) h = 0;
    if (isNaN(m) || m < 0) m = 0;
    if (isNaN(s) || s < 0) s = 0;
    h = Math.min(h, 99);
    m = Math.min(m, 59);
    s = Math.min(s, 59);

    t.durHr.value  = h;
    t.durMin.value = m;
    t.durSec.value = s;
    t.duration = (h * 3600 + m * 60 + s) * 1000;

    resetTimer(t);
  }

  /* ---------------- 建立 / 刪除計時器 ---------------- */

  function createTimer(name) {
    var id = ++seq;

    var el = document.createElement('section');
    el.className = 'timer-card';
    el.dataset.id = String(id);
    el.innerHTML =
      '<div class="card-head">' +
        '<input class="timer-name" type="text" spellcheck="false" aria-label="計時器名稱">' +
        '<button class="icon-btn" type="button" title="刪除計時器" aria-label="刪除計時器">✕</button>' +
      '</div>' +
      '<div class="time">00:00:00.00</div>' +
      '<div class="btns">' +
        '<button type="button" class="start">開始</button>' +
        '<button type="button" class="lap secondary" disabled>計次</button>' +
        '<button type="button" class="reset secondary">重設</button>' +
      '</div>' +
      '<div class="mode-row">' +
        '<select class="mode-select" aria-label="計時模式">' +
          '<option value="up">正計時</option>' +
          '<option value="down">倒計時</option>' +
        '</select>' +
        '<div class="duration-inputs hidden">' +
          '<input class="dur-hr"  type="number" min="0" max="99" step="1" value="0" aria-label="小時">' +
          '<span>時</span>' +
          '<input class="dur-min" type="number" min="0" max="59" step="1" value="5" aria-label="分鐘">' +
          '<span>分</span>' +
          '<input class="dur-sec" type="number" min="0" max="59" step="1" value="0" aria-label="秒">' +
          '<span>秒</span>' +
        '</div>' +
      '</div>' +
      '<ul class="laps"></ul>';

    var t = {
      id: id,
      el: el,
      nameEl:     el.querySelector('.timer-name'),
      timeEl:     el.querySelector('.time'),
      startBtn:   el.querySelector('.start'),
      lapBtn:     el.querySelector('.lap'),
      resetBtn:   el.querySelector('.reset'),
      lapsEl:     el.querySelector('.laps'),
      modeSelect: el.querySelector('.mode-select'),
      durWrap:    el.querySelector('.duration-inputs'),
      durHr:      el.querySelector('.dur-hr'),
      durMin:     el.querySelector('.dur-min'),
      durSec:     el.querySelector('.dur-sec'),
      mode: 'up',
      duration: 5 * 60 * 1000,   // 預設 5 分鐘
      finished: false,
      running: false,
      startStamp: 0,
      accumulated: 0,
      lapCount: 0
    };

    t.nameEl.value = name || ('計時器 ' + id);

    t.startBtn.addEventListener('click', function () { toggleTimer(t); });
    t.lapBtn.addEventListener('click',   function () { addLap(t); });
    t.resetBtn.addEventListener('click', function () { resetTimer(t); });

    t.modeSelect.addEventListener('change', function () { onModeChange(t); });
    t.durHr.addEventListener('change',  function () { applyDuration(t); });
    t.durMin.addEventListener('change', function () { applyDuration(t); });
    t.durSec.addEventListener('change', function () { applyDuration(t); });

    el.querySelector('.icon-btn').addEventListener('click', function () {
      removeTimer(t.id);
    });

    updateTime(t);
    return t;
  }

  function addTimer(name, focusName) {
    var t = createTimer(name);
    timers.set(t.id, t);
    grid.appendChild(t.el);

    if (focusName) {
      t.nameEl.focus();
      t.nameEl.select();
    }
    return t;
  }

  function removeTimer(id) {
    var t = timers.get(id);
    if (!t) return;

    timers.delete(id);
    t.el.remove();

    if (timers.size === 0) addTimer();   // 永遠至少留一個
  }

  /* ---------------- 全螢幕 ---------------- */

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      var p = document.documentElement.requestFullscreen &&
              document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }

  document.addEventListener('fullscreenchange', function () {
    fsBtn.textContent = document.fullscreenElement ? '退出全螢幕' : '全螢幕';
  });

  /* ---------------- 事件綁定 ---------------- */

  addBtn.addEventListener('click', function () { addTimer(null, true); });
  fsBtn.addEventListener('click', toggleFullscreen);

  /* ---------------- 初始 ---------------- */

  addTimer('計時器 1', false);
})();
</script>

</body>
</html>
